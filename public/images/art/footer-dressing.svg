<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" width="1600" height="240" preserveAspectRatio="xMidYMax slice" role="img" aria-label="">
  <!-- Une scène de boutique en silhouette, posée au bas du pied de page.
       Trois plans de profondeur, comme un décor peint : le fond très pâle,
       le portant au milieu, le mobilier dense au premier plan.
       Les teintes sont des gris tirés vers le vin, jamais du gris pur. -->

  <!-- ===== PLAN 3 : le fond, très pâle ===== -->
  <g fill="#d6c6cb">
    <!-- rayonnages de gauche -->
    <rect x="34" y="62" width="250" height="5" rx="2.5"/>
    <rect x="34" y="104" width="250" height="5" rx="2.5"/>
    <rect x="34" y="146" width="250" height="5" rx="2.5"/>
    <g>
      <rect x="48" y="34" width="34" height="28" rx="4"/><rect x="90" y="26" width="26" height="36" rx="4"/>
      <rect x="124" y="40" width="40" height="22" rx="4"/><rect x="172" y="30" width="28" height="32" rx="4"/>
      <rect x="208" y="42" width="44" height="20" rx="4"/>
      <rect x="52" y="78" width="40" height="26" rx="4"/><rect x="100" y="70" width="28" height="34" rx="4"/>
      <rect x="136" y="82" width="44" height="22" rx="4"/><rect x="188" y="74" width="30" height="30" rx="4"/>
      <rect x="226" y="86" width="34" height="18" rx="4"/>
      <rect x="46" y="120" width="36" height="26" rx="4"/><rect x="90" y="114" width="30" height="32" rx="4"/>
      <rect x="128" y="124" width="46" height="22" rx="4"/><rect x="182" y="116" width="28" height="30" rx="4"/>
      <rect x="218" y="126" width="40" height="20" rx="4"/>
    </g>
    <!-- rayonnages de droite -->
    <rect x="1316" y="62" width="250" height="5" rx="2.5"/>
    <rect x="1316" y="104" width="250" height="5" rx="2.5"/>
    <rect x="1316" y="146" width="250" height="5" rx="2.5"/>
    <g>
      <rect x="1330" y="36" width="36" height="26" rx="4"/><rect x="1374" y="26" width="26" height="36" rx="4"/>
      <rect x="1408" y="42" width="42" height="20" rx="4"/><rect x="1458" y="32" width="28" height="30" rx="4"/>
      <rect x="1494" y="44" width="44" height="18" rx="4"/>
      <rect x="1334" y="80" width="42" height="24" rx="4"/><rect x="1384" y="70" width="28" height="34" rx="4"/>
      <rect x="1420" y="84" width="40" height="20" rx="4"/><rect x="1468" y="76" width="30" height="28" rx="4"/>
      <rect x="1506" y="86" width="36" height="18" rx="4"/>
      <rect x="1328" y="122" width="38" height="24" rx="4"/><rect x="1374" y="114" width="30" height="32" rx="4"/>
      <rect x="1412" y="124" width="44" height="22" rx="4"/><rect x="1464" y="118" width="28" height="28" rx="4"/>
      <rect x="1500" y="128" width="42" height="18" rx="4"/>
    </g>
  </g>

  <!-- ===== PLAN 2 : le portant et ses vêtements ===== -->
  <g fill="#c2a9b2">
    <!-- la barre, ses montants et ses pieds -->
    <rect x="316" y="44" width="968" height="7" rx="3.5"/>
    <rect x="366" y="44" width="6" height="140"/>
    <rect x="1228" y="44" width="6" height="140"/>
    <path d="M342 184h54v6h-54zM1204 184h54v6h-54z"/>

    <!-- robe longue à bretelles -->
    <g transform="translate(418 36)">
      <path d="M0 0a6 6 0 0 1 6 6c0 3-2.4 4.9-4.8 5.6V14" fill="none" stroke="#c2a9b2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1.2 14-26 33q-2.4 1.7 .6 1.7h51q3 0 .6-1.7z"/>
      <path d="M-13 35h26l-4 18h-18z"/>
      <path d="M-17 53h34l16 90q1.2 7-6 7h-54q-7.2 0-6-7z"/>
    </g>

    <!-- chemise -->
    <g transform="translate(512 36)">
      <path d="M0 0a6 6 0 0 1 6 6c0 3-2.4 4.9-4.8 5.6V14" fill="none" stroke="#c2a9b2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1.2 14-24 32q-2.2 1.6 .5 1.6h47q2.7 0 .5-1.6z"/>
      <path d="M-17 34h34l10 24-10 4v50h-34V62l-10-4z"/>
      <path d="M0 34l-8 15 8 8 8-8z" fill="#d6c6cb"/>
      <circle cx="0" cy="76" r="2.4" fill="#d6c6cb"/><circle cx="0" cy="90" r="2.4" fill="#d6c6cb"/>
    </g>

    <!-- blazer à revers -->
    <g transform="translate(600 36)">
      <path d="M0 0a6 6 0 0 1 6 6c0 3-2.4 4.9-4.8 5.6V14" fill="none" stroke="#c2a9b2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1.2 14-27 34q-2.5 1.8 .6 1.8h53q3.1 0 .6-1.8z"/>
      <path d="M-20 36h40l11 27-11 5v56h-40V68l-11-5z"/>
      <path d="M-8 36 0 62l8-26z" fill="#d6c6cb"/>
      <path d="M-16 92h10v16h-10z" fill="#d6c6cb" opacity=".6"/>
    </g>

    <!-- jupe plissée -->
    <g transform="translate(692 56)">
      <rect x="-23" y="0" width="46" height="6" rx="3"/>
      <path d="M-23 6h46l17 82q1.2 6-4.6 6h-70.8q-5.8 0-4.6-6z"/>
      <g fill="#d6c6cb" opacity=".45">
        <path d="M-14 6h4l-7 82h-5zM-3 6h4l-2 82h-5zM8 6h4l3 82h-5z"/>
      </g>
    </g>

    <!-- robe courte -->
    <g transform="translate(784 36)">
      <path d="M0 0a6 6 0 0 1 6 6c0 3-2.4 4.9-4.8 5.6V14" fill="none" stroke="#c2a9b2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1.2 14-23 31q-2.1 1.5 .5 1.5h45q2.6 0 .5-1.5z"/>
      <path d="M-16 33h32l14 62q1 6-5 6h-50q-6 0-5-6z"/>
      <path d="M-16 56h32l1 5h-34z" fill="#d6c6cb"/>
    </g>

    <!-- pantalon droit -->
    <g transform="translate(872 54)">
      <rect x="-22" y="0" width="44" height="6" rx="3"/>
      <path d="M-22 6h44l-4 100h-15l-3-62-3 62h-15z"/>
      <path d="M-22 18h44v3h-44z" fill="#d6c6cb" opacity=".5"/>
    </g>

    <!-- top court -->
    <g transform="translate(950 36)">
      <path d="M0 0a6 6 0 0 1 6 6c0 3-2.4 4.9-4.8 5.6V14" fill="none" stroke="#c2a9b2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1.2 14-20 29q-1.9 1.4 .5 1.4h39q2.4 0 .5-1.4z"/>
      <path d="M-14 31h28l5 48h-38z"/>
    </g>

    <!-- manteau long -->
    <g transform="translate(1028 36)">
      <path d="M0 0a6 6 0 0 1 6 6c0 3-2.4 4.9-4.8 5.6V14" fill="none" stroke="#c2a9b2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1.2 14-29 35q-2.7 1.9 .7 1.9h56.6q3.4 0 .7-1.9z"/>
      <path d="M-21 37h42l12 28-12 5v72h-42V70l-12-5z"/>
      <path d="M-21 37v105M21 37v105" stroke="#d6c6cb" stroke-width="2" fill="none" opacity=".5"/>
      <circle cx="0" cy="82" r="3" fill="#d6c6cb"/><circle cx="0" cy="98" r="3" fill="#d6c6cb"/>
      <circle cx="0" cy="114" r="3" fill="#d6c6cb"/>
    </g>

    <!-- robe à volants -->
    <g transform="translate(1122 36)">
      <path d="M0 0a6 6 0 0 1 6 6c0 3-2.4 4.9-4.8 5.6V14" fill="none" stroke="#c2a9b2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1.2 14-22 30q-2 1.4 .5 1.4h43q2.5 0 .5-1.4z"/>
      <path d="M-15 32h30l7 28h-44z"/>
      <path d="M-25 62h50l7 26h-64z"/>
      <path d="M-35 90h70l8 28q1 6-5 6h-76q-6 0-5-6z"/>
    </g>

    <!-- pantalon large -->
    <g transform="translate(1198 54)">
      <rect x="-24" y="0" width="48" height="6" rx="3"/>
      <path d="M-24 6h48l-7 104h-16l-1-58-1 58h-16z"/>
    </g>
  </g>

  <!-- ===== PLAN 1 : le sol et le mobilier, dense ===== -->
  <g fill="#ab8b97">
    <!-- le sol, avec un léger relief -->
    <path d="M0 186h1600v54H0z"/>
    <path d="M0 186c130-7 230 5 356 3 148-4 236-10 386-7 160 4 268 10 428 6 140-3 256-9 386-4 16 1 30 2 44 2v54H0z" opacity=".5"/>

    <!-- miroir sur pied, à gauche -->
    <g transform="translate(120 84)">
      <rect x="-30" y="0" width="60" height="96" rx="30"/>
      <rect x="-24" y="6" width="48" height="84" rx="24" fill="#c2a9b2"/>
      <rect x="-3.5" y="96" width="7" height="8"/>
      <ellipse cx="0" cy="105" rx="22" ry="5"/>
      <path d="M-8 30q10 14 20 2" stroke="#d6c6cb" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- pouf capitonné -->
    <g transform="translate(244 154)">
      <ellipse cx="0" cy="12" rx="30" ry="11"/>
      <path d="M-30 12V2q0-15 30-15t30 15v10z"/>
      <path d="M-30 2h60M0 -13v25" stroke="#c2a9b2" stroke-width="2" opacity=".5" fill="none"/>
    </g>

    <!-- boîtes empilées -->
    <g transform="translate(312 150)">
      <rect x="-27" y="20" width="54" height="17" rx="2.5"/>
      <rect x="-22" y="4" width="44" height="16" rx="2.5"/>
      <rect x="-16" y="-9" width="32" height="13" rx="2.5"/>
      <path d="M-27 27h54M-22 11h44" stroke="#c2a9b2" stroke-width="2" opacity=".55"/>
    </g>

    <!-- mannequin de couturière -->
    <g transform="translate(1290 82)">
      <path d="M0 0q19 0 22.5 25t-6.5 45q-3.5 9-16 9t-16-9q-10-20-6.5-45T0 0z"/>
      <path d="M-20 34h40" stroke="#c2a9b2" stroke-width="2.5" opacity=".6" fill="none"/>
      <rect x="-3" y="79" width="6" height="16"/>
      <path d="M-17 95h34l-17 6z"/>
      <ellipse cx="0" cy="100" rx="18" ry="5"/>
    </g>

    <!-- table basse : chapeau, sac, parfum -->
    <g transform="translate(1400 142)">
      <rect x="-46" y="0" width="92" height="6" rx="3"/>
      <rect x="-39" y="6" width="5" height="40"/>
      <rect x="34" y="6" width="5" height="40"/>
      <!-- chapeau -->
      <ellipse cx="-22" cy="-2" rx="27" ry="6"/>
      <path d="M-35 -2q0-19 13-19t13 19z"/>
      <path d="M-33 -6h22" stroke="#c2a9b2" stroke-width="3" opacity=".6"/>
      <!-- sac à main -->
      <path d="M10 -2v-15q0-10 10-10t10 10v15" fill="none" stroke="#ab8b97" stroke-width="3.5"/>
      <rect x="5" y="-18" width="30" height="16" rx="2.5"/>
      <!-- flacon -->
      <rect x="40" y="-14" width="10" height="12" rx="2"/>
      <rect x="43" y="-18" width="4" height="4"/>
    </g>

    <!-- plante en pot -->
    <g transform="translate(1530 122)">
      <path d="M-15 30h30l-5 34h-20z"/>
      <path d="M-15 30h30v4h-30z" fill="#c2a9b2"/>
      <path d="M0 30V0M0 14q-16-5-18-21 16 1 18 16M0 9q15-6 17-21-15 1-17 16M0 24q-13-4-15-16 13 1 15 13"
        fill="none" stroke="#ab8b97" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
