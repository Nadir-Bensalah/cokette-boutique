<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 230" width="1600" height="230" preserveAspectRatio="xMidYMax meet" role="img" aria-label="">
  <!-- Une scène de boutique en silhouette, à poser en bas du pied de page.
       Trois plans : le fond très pâle, le portant, le premier plan dense.
       Les teintes sont des gris tirés vers le vin, jamais du gris pur. -->
  <defs>
    <g id="cintre">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.6-2 4.2-4 4.8V13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M1 13-28 34q-2.6 1.9 .6 1.9h56q3.2 0 .6-1.9z" />
    </g>
  </defs>

  <!-- PLAN 3 : le fond, très pâle. Étagères et silhouettes lointaines. -->
  <g fill="#cbb9bf" opacity=".5">
    <rect x="60" y="96" width="210" height="4" rx="2"/>
    <rect x="60" y="130" width="210" height="4" rx="2"/>
    <rect x="76" y="72" width="26" height="24" rx="3"/>
    <rect x="110" y="66" width="22" height="30" rx="3"/>
    <rect x="140" y="76" width="30" height="20" rx="3"/>
    <rect x="180" y="70" width="24" height="26" rx="3"/>
    <rect x="212" y="78" width="34" height="18" rx="3"/>
    <rect x="84" y="108" width="30" height="22" rx="3"/>
    <rect x="122" y="104" width="24" height="26" rx="3"/>
    <rect x="154" y="112" width="34" height="18" rx="3"/>
    <rect x="196" y="106" width="26" height="24" rx="3"/>

    <rect x="1330" y="96" width="210" height="4" rx="2"/>
    <rect x="1330" y="130" width="210" height="4" rx="2"/>
    <rect x="1346" y="74" width="28" height="22" rx="3"/>
    <rect x="1382" y="66" width="22" height="30" rx="3"/>
    <rect x="1412" y="78" width="32" height="18" rx="3"/>
    <rect x="1452" y="70" width="24" height="26" rx="3"/>
    <rect x="1484" y="76" width="30" height="20" rx="3"/>
    <rect x="1352" y="110" width="32" height="20" rx="3"/>
    <rect x="1392" y="104" width="24" height="26" rx="3"/>
    <rect x="1424" y="108" width="30" height="22" rx="3"/>
    <rect x="1464" y="106" width="26" height="24" rx="3"/>
  </g>

  <!-- PLAN 2 : le portant principal, avec ses vêtements pendus. -->
  <g fill="#bda7af">
    <!-- la barre et ses pieds -->
    <rect x="300" y="52" width="1000" height="6" rx="3"/>
    <rect x="352" y="52" width="5" height="121"/>
    <rect x="1244" y="52" width="5" height="121"/>
    <path d="M330 171h50v5h-50zM1222 171h50v5h-50z"/>

    <!-- robe longue -->
    <g transform="translate(400 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-22 28q-2 1.4 .5 1.4h43q2.5 0 .5-1.4z"/>
      <path d="M-15 30h32l10 86q1 6-5 6h-42q-6 0-5-6z"/>
    </g>
    <!-- chemise -->
    <g transform="translate(486 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-20 27q-1.8 1.3 .4 1.3h39q2.2 0 .4-1.3z"/>
      <path d="M-14 29h30l6 20-8 3v42h-26V52l-8-3z"/>
    </g>
    <!-- veste -->
    <g transform="translate(566 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-23 29q-2 1.4 .5 1.4h45q2.5 0 .5-1.4z"/>
      <path d="M-17 31h34l9 24-9 4v48h-34V59l-9-4z"/>
      <path d="M0 31l-7 22h14z" fill="#cbb9bf"/>
    </g>
    <!-- jupe plissée -->
    <g transform="translate(652 62)">
      <rect x="-20" y="0" width="40" height="5" rx="2.5"/>
      <path d="M-20 5h40l14 74q1 5-4 5h-60q-5 0-4-5z"/>
    </g>
    <!-- robe courte -->
    <g transform="translate(730 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-20 27q-1.8 1.3 .4 1.3h39q2.2 0 .4-1.3z"/>
      <path d="M-14 29h30l12 58q1 5-4 5h-46q-5 0-4-5z"/>
    </g>
    <!-- pantalon -->
    <g transform="translate(812 60)">
      <rect x="-19" y="0" width="38" height="5" rx="2.5"/>
      <path d="M-19 5h38l-3 88h-13l-5-56-5 56h-13z"/>
    </g>
    <!-- top -->
    <g transform="translate(884 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-18 25q-1.6 1.2 .4 1.2h35q2 0 .4-1.2z"/>
      <path d="M-12 27h26l4 44h-34z"/>
    </g>
    <!-- manteau long -->
    <g transform="translate(956 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-24 30q-2.2 1.5 .6 1.5h47q2.8 0 .6-1.5z"/>
      <path d="M-18 32h36l10 26-10 4v64h-36V62l-10-4z"/>
      <circle cx="0" cy="74" r="2.6" fill="#cbb9bf"/>
      <circle cx="0" cy="88" r="2.6" fill="#cbb9bf"/>
    </g>
    <!-- robe à volants -->
    <g transform="translate(1046 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-19 26q-1.7 1.2 .4 1.2h37q2.1 0 .4-1.2z"/>
      <path d="M-13 28h26l6 26h-38z"/>
      <path d="M-22 56h44l6 24h-56z"/>
      <path d="M-30 82h60l7 26q1 5-4 5h-66q-5 0-4-5z"/>
    </g>
    <!-- blouse -->
    <g transform="translate(1130 46)">
      <path d="M0 0a5 5 0 0 1 5 5c0 2.5-2 4.1-4 4.7V12" fill="none" stroke="#bda7af" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M1 12-20 27q-1.8 1.3 .4 1.3h39q2.2 0 .4-1.3z"/>
      <path d="M-14 29h30l7 22-8 3v40h-28V54l-8-3z"/>
    </g>
    <!-- pantalon large -->
    <g transform="translate(1200 60)">
      <rect x="-21" y="0" width="42" height="5" rx="2.5"/>
      <path d="M-21 5h42l-6 92h-14l-1-52-1 52h-14z"/>
    </g>
  </g>

  <!-- PLAN 1 : le sol et le mobilier au premier plan, plus dense. -->
  <g fill="#a98d97">
    <!-- le sol -->
    <path d="M0 176h1600v54H0z"/>
    <path d="M0 176c120-6 210 4 330 2 140-3 220-9 360-6 150 3 250 9 400 6 130-3 240-8 360-4 60 2 110 4 150 2v54H0z" opacity=".55"/>

    <!-- miroir sur pied, à gauche -->
    <g transform="translate(120 88)">
      <rect x="-26" y="0" width="52" height="86" rx="26"/>
      <rect x="-3" y="86" width="6" height="7"/>
      <path d="M-18 93h36l4 0v0z"/>
      <ellipse cx="0" cy="93" rx="19" ry="4"/>
      <ellipse cx="0" cy="26" rx="18" ry="26" fill="#bda7af" opacity=".5"/>
    </g>

    <!-- pouf -->
    <g transform="translate(232 152)">
      <ellipse cx="0" cy="8" rx="26" ry="10"/>
      <path d="M-26 8v-8q0-13 26-13t26 13v8z"/>
    </g>

    <!-- table basse avec chapeau et sac -->
    <g transform="translate(1382 140)">
      <rect x="-40" y="0" width="80" height="5" rx="2.5"/>
      <rect x="-34" y="5" width="4" height="36"/>
      <rect x="30" y="5" width="4" height="36"/>
      <!-- chapeau -->
      <ellipse cx="-16" cy="-2" rx="24" ry="5"/>
      <path d="M-28 -2q0-16 12-16t12 16z"/>
      <!-- sac -->
      <path d="M12 -2v-14q0-9 9-9t9 9v14z" fill="none" stroke="#a98d97" stroke-width="3"/>
      <rect x="8" y="-16" width="26" height="14" rx="2"/>
    </g>

    <!-- plante, à droite -->
    <g transform="translate(1522 126)">
      <path d="M-13 26h26l-4 29h-18z"/>
      <path d="M0 26V2M0 12q-14-4-16-18 14 1 16 14M0 8q13-5 15-18-13 1-15 14M0 20q-11-3-13-14 11 1 13 11" fill="none" stroke="#a98d97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- boîtes empilées, à gauche du portant -->
    <g transform="translate(296 150)">
      <rect x="-24" y="16" width="48" height="15" rx="2"/>
      <rect x="-19" y="2" width="38" height="14" rx="2"/>
      <rect x="-14" y="-10" width="28" height="12" rx="2"/>
    </g>

    <!-- mannequin de couturière, à droite du portant -->
    <g transform="translate(1300 92)">
      <path d="M0 0q17 0 20 22t-6 40q-3 8-14 8t-14-8q-9-18-6-40T0 0z"/>
      <rect x="-2.6" y="70" width="5.2" height="14"/>
      <path d="M-15 84h30l-15 5z"/>
      <ellipse cx="0" cy="88" rx="16" ry="4"/>
    </g>
  </g>
</svg>
